name: Build and Release DXT

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    branches:
      - main

# Least privilege: the only elevated need is creating the release tag + the
# release + uploading the .dxt asset. Everything else runs read-only.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      # Release when the run is for a version that has no tag yet: either a
      # pushed v* tag (including a manual create-tag.yml + dispatch flow), or a
      # push to main whose package.json version is untagged — so merging a
      # version bump releases it without a separately pushed tag. Non-bump main
      # pushes and branch dispatches stay build-only.
      - name: Determine release tag
        id: reltag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            TAG="v$(node -p "require('./package.json').version")"
            [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "unexpected version '$TAG'" >&2; exit 1; }
            if git ls-remote --exit-code origin "refs/tags/$TAG" >/dev/null; then
              echo "tag $TAG already exists — build-only run"
              echo "release=false" >> "$GITHUB_OUTPUT"
            else
              echo "tag=$TAG" >> "$GITHUB_OUTPUT"
              echo "release=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Drop dev dependencies from the archive
        run: npm prune --omit=dev

      - name: Pack DXT
        run: npx --yes @anthropic-ai/dxt@0.2.6 pack

      - name: Compute version and rename artifact
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          FILE=$(ls -1 *.dxt | head -n1)
          mv "$FILE" "fastmail-mcp-$VERSION.dxt"
          echo "DXT_FILE=fastmail-mcp-$VERSION.dxt" >> $GITHUB_ENV

      - name: Boot-smoke the packed artifact
        shell: bash
        # Unpack the exact archive we are about to publish and prove it boots.
        # A .dxtignore pattern once stripped a runtime dependency's entry point
        # (node_modules/debug/src) and the .dxt died silently on initialize —
        # this gate makes that class of packaging bug unpublishable.
        run: |
          set -euo pipefail
          TMP=$(mktemp -d)
          unzip -q "$DXT_FILE" -d "$TMP"
          REQ='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"dxt-boot-smoke","version":"0.0.0"}}}'
          OUT=$(printf '%s\n' "$REQ" | FASTMAIL_API_TOKEN=dummy-boot-smoke timeout 30s node "$TMP/dist/index.js")
          grep -q '"serverInfo"' <<< "$OUT" || { echo "packed .dxt failed to answer initialize" >&2; exit 1; }
          echo "packed artifact boots and answers initialize"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fastmail-mcp-dxt
          path: ${{ env.DXT_FILE }}

      # The tag is created only after the packed artifact has proven it boots,
      # so a broken build can never leave a published tag behind.
      - name: Tag the release commit
        if: steps.reltag.outputs.release == 'true' && startsWith(github.ref, 'refs/heads/')
        shell: bash
        env:
          TAG: ${{ steps.reltag.outputs.tag }}
        run: |
          set -euo pipefail
          git tag "$TAG"
          git push origin "refs/tags/$TAG"

      - name: Create GitHub Release
        if: steps.reltag.outputs.release == 'true'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.reltag.outputs.tag }}
          files: ${{ env.DXT_FILE }}
          # Seed the release body with the auto-generated PR list so new
          # releases never publish empty; hand-written notes can replace it.
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
